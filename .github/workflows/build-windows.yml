name: Build Windows Installer

# Trigger manually from GitHub Actions UI.
# Enter a version number (e.g. 1.2.0) and choose publication options.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number — must be X.Y.Z (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      publish_release:
        description: 'Create GitHub Release and attach installer'
        type: boolean
        required: false
        default: false
      publish_to_buildharvey:
        description: 'Upload to buildharvey.com and activate for download'
        type: boolean
        required: false
        default: false

# GITHUB_TOKEN needs write access to create releases.
permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'
  TESSERACT_VERSION: '5.3.3.20231005'
  TESSERACT_DIR: 'C:\Program Files\Tesseract-OCR'
  INNOSETUP_DIR: 'C:\Program Files (x86)\Inno Setup 6'

jobs:
  build:
    name: Build v${{ github.event.inputs.version }}
    runs-on: windows-latest

    steps:
      # ── Version validation (fail fast before spending CI time) ───────────────
      - name: Validate version format
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if ($ver -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version '$ver' must be in format X.Y.Z (e.g. 1.2.3)"
          }
          Write-Host "Version: $ver — format OK"
          echo "BUILD_VERSION=$ver" >> $env:GITHUB_ENV

      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python environment ────────────────────────────────────────────────────
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: agent/requirements_windows.txt

      - name: Create virtual environment
        working-directory: agent
        shell: pwsh
        run: python -m venv .venv

      - name: Install Python dependencies (with retry)
        working-directory: agent
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              .\.venv\Scripts\pip install --upgrade pip --quiet
              .\.venv\Scripts\pip install -r requirements_windows.txt
              Write-Host "pip install succeeded on attempt $attempt"
              break
            } catch {
              if ($attempt -lt 3) {
                Write-Host "pip attempt $attempt failed: $_ — retrying in 20s..."
                Start-Sleep 20
              } else { throw }
            }
          }

      - name: Capture pinned dependency versions
        working-directory: agent
        shell: pwsh
        run: |
          .\.venv\Scripts\pip freeze | Out-File -FilePath "$env:GITHUB_WORKSPACE\agent\pip-freeze-$env:BUILD_VERSION.txt" -Encoding utf8
          Write-Host "Pinned versions captured."

      - name: Verify Python dependencies
        working-directory: agent
        shell: pwsh
        run: |
          $check = @'
          import sys
          print(f"Python {sys.version}")
          required = [
              "mss", "PIL", "numpy", "keyring", "psutil",
              "pytesseract", "win32api", "win32gui",
              "win32process", "pywinauto", "websockets", "realtime",
          ]
          failed = []
          for mod in required:
              try:
                  __import__(mod)
                  print(f"  ok   {mod}")
              except ImportError as e:
                  failed.append(f"{mod}: {e}")
                  print(f"  FAIL {mod}: {e}")
          if failed:
              sys.exit(1)
          # Explicitly verify anthropic is NOT present
          try:
              import anthropic
              print("  FAIL anthropic: present in venv — should have been removed")
              sys.exit(1)
          except ImportError:
              print("  ok   anthropic absent (expected)")
          print("All dependency checks passed.")
          '@
          Set-Content -Path "$env:TEMP\bh_dep_check.py" -Value $check
          .\.venv\Scripts\python.exe "$env:TEMP\bh_dep_check.py"

      # ── Build-time secret audit ───────────────────────────────────────────────
      - name: Build-time secret audit
        working-directory: agent
        shell: pwsh
        run: |
          Write-Host "Running secret audit via scripts/audit_package_secrets.py..."
          .\.venv\Scripts\python.exe scripts/audit_package_secrets.py .
          $auditExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0   # reset immediately — let explicit throw control the step outcome
          if ($auditExit -eq 1) {
            throw "Secret audit failed: credential(s) found in agent source — build aborted"
          }
          if ($auditExit -eq 2) {
            throw "Secret audit could not run — build aborted"
          }
          Write-Host "Secret audit passed."

      # ── Tesseract OCR (via Chocolatey — avoids brittle direct-download URLs) ──
      - name: Install Tesseract ${{ env.TESSERACT_VERSION }} via Chocolatey (with retry)
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Chocolatey install attempt $attempt..."
            choco install tesseract --version=$env:TESSERACT_VERSION -y --no-progress
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -lt 3) {
              Write-Host "Attempt $attempt failed; retrying in 20s..."
              Start-Sleep 20
            } else { throw "Chocolatey tesseract install failed after 3 attempts" }
          }

          # Resolve actual install path: Get-Command → where.exe → known candidates
          $tessExe = $null
          try { $tessExe = (Get-Command tesseract -ErrorAction SilentlyContinue)?.Source } catch {}
          if (!$tessExe) {
            try { $tessExe = (where.exe tesseract 2>$null | Select-Object -First 1) } catch {}
          }
          if (!$tessExe) {
            foreach ($c in @(
              "$env:TESSERACT_DIR\tesseract.exe",
              "C:\ProgramData\chocolatey\bin\tesseract.exe",
              "C:\tools\tesseract\tesseract.exe"
            )) { if (Test-Path $c) { $tessExe = $c; break } }
          }
          if (!$tessExe) { throw "tesseract.exe not found after Chocolatey install" }

          $resolvedDir = Split-Path $tessExe -Parent
          Write-Host "Tesseract resolved at: $tessExe"
          echo "TESSERACT_DIR=$resolvedDir" >> $env:GITHUB_ENV

      - name: Verify Tesseract system installation
        shell: pwsh
        run: |
          $exe = "$env:TESSERACT_DIR\tesseract.exe"
          if (!(Test-Path $exe)) { throw "tesseract.exe not found at $exe" }

          $ver = & $exe --version 2>&1 | Select-Object -First 1
          Write-Host "Tesseract system version: $ver"
          echo "TESSERACT_ACTUAL_VERSION=$ver" >> $env:GITHUB_ENV

          $data = "$env:TESSERACT_DIR\tessdata\eng.traineddata"
          if (!(Test-Path $data)) { throw "eng.traineddata missing" }
          Write-Host "eng.traineddata: present"

          $dlls = @(Get-ChildItem "$env:TESSERACT_DIR\*.dll")
          Write-Host "DLLs in system dir: $($dlls.Count)"
          if ($dlls.Count -eq 0) { throw "No DLLs found in Tesseract directory" }

      - name: Stage Tesseract into vendor/tesseract/ (clean copy)
        working-directory: agent
        shell: pwsh
        run: |
          $src = $env:TESSERACT_DIR
          $dst = "vendor\tesseract"

          # Clear any stale vendor copy before staging
          if (Test-Path $dst) {
            Remove-Item $dst -Recurse -Force
            Write-Host "Cleared stale vendor/tesseract"
          }
          New-Item -ItemType Directory -Force -Path "$dst\tessdata" | Out-Null

          Copy-Item "$src\tesseract.exe"                   $dst -Force
          Copy-Item "$src\*.dll"                           $dst -Force -ErrorAction SilentlyContinue
          Copy-Item "$src\tessdata\eng.traineddata"        "$dst\tessdata\" -Force

          # Verify staged files
          if (!(Test-Path "$dst\tesseract.exe"))            { throw "Stage failed: tesseract.exe missing" }
          if (!(Test-Path "$dst\tessdata\eng.traineddata")) { throw "Stage failed: eng.traineddata missing" }
          $dlls = @(Get-ChildItem "$dst\*.dll")
          if ($dlls.Count -eq 0)                           { throw "Stage failed: no DLLs copied" }
          Write-Host "Staged: tesseract.exe + $($dlls.Count) DLLs + tessdata/eng.traineddata"

      - name: Verify vendored Tesseract OCR smoke test
        working-directory: agent
        shell: pwsh
        run: |
          # Run the vendored binary's version
          $vendored = "vendor\tesseract\tesseract.exe"
          if (!(Test-Path $vendored)) { throw "Vendored tesseract.exe not found" }
          $vVer = & $vendored --version 2>&1 | Select-Object -First 1
          Write-Host "Vendored Tesseract version: $vVer"

          # OCR smoke test: generate image with "BuildHarvey OCR Test" and read it back
          $smoke = @'
          import sys, os, tempfile
          sys.path.insert(0, sys.argv[1])
          from PIL import Image, ImageDraw
          import pytesseract

          vendor = os.path.join(sys.argv[1], "vendor", "tesseract", "tesseract.exe")
          pytesseract.pytesseract.tesseract_cmd = vendor
          os.environ["TESSDATA_PREFIX"] = os.path.join(sys.argv[1], "vendor", "tesseract", "tessdata")

          img = Image.new("RGB", (600, 80), color="white")
          draw = ImageDraw.Draw(img)
          draw.text((10, 20), "BuildHarvey OCR Test", fill="black")
          tmp = tempfile.mktemp(suffix=".png")
          img.save(tmp)
          result = pytesseract.image_to_string(Image.open(tmp), lang="eng")
          os.unlink(tmp)
          result_lower = result.lower()
          if "buildharvey" not in result_lower and "ocr" not in result_lower:
              raise RuntimeError(f"OCR smoke test FAILED — got: {repr(result.strip()[:120])}")
          print(f"[smoke] vendored Tesseract OCR: PASS — read: {repr(result.strip()[:60])}")
          '@
          Set-Content -Path "$env:TEMP\bh_ocr_smoke.py" -Value $smoke
          .\.venv\Scripts\python.exe "$env:TEMP\bh_ocr_smoke.py" (Get-Location).Path
          if ($LASTEXITCODE -ne 0) { throw "Vendored Tesseract OCR smoke test FAILED" }

      # ── Inno Setup ───────────────────────────────────────────────────────────
      - name: Install Inno Setup via Chocolatey (with retry)
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -lt 3) { Write-Host "Retrying in 20s..."; Start-Sleep 20 }
            else { throw "Inno Setup install failed after 3 attempts" }
          }

      - name: Verify Inno Setup
        shell: pwsh
        run: |
          $iscc = "$env:INNOSETUP_DIR\ISCC.exe"
          if (!(Test-Path $iscc)) {
            # Try alternate discovery
            $alt = (Get-ChildItem "C:\Program Files*" -Recurse -Filter "ISCC.exe" -ErrorAction SilentlyContinue |
                    Select-Object -First 1)?.FullName
            if ($alt) { $iscc = $alt; echo "INNOSETUP_DIR=$(Split-Path $alt -Parent)" >> $env:GITHUB_ENV }
            else { throw "ISCC.exe not found — Inno Setup may not have installed correctly" }
          }
          Write-Host "Inno Setup: $iscc"

      # ── Pre-build checks ──────────────────────────────────────────────────────
      - name: Run pre-build checks
        working-directory: agent
        shell: pwsh
        run: |
          $script = @'
          import sys, os, tempfile, sqlite3

          os.chdir(sys.argv[1])
          sys.path.insert(0, ".")

          print("[check] Core Python imports (no anthropic)...")
          import mss, PIL, numpy, keyring, psutil, pytesseract
          import win32api, win32gui, win32process
          try:
              import anthropic
              raise AssertionError("anthropic must NOT be importable — remove from venv")
          except ImportError:
              pass
          print("[check] Core imports: PASS")

          print("[check] SQLite...")
          db = tempfile.mktemp(suffix=".db")
          conn = sqlite3.connect(db)
          conn.execute("CREATE TABLE t (id TEXT PRIMARY KEY)")
          conn.close()
          os.unlink(db)
          print("[check] SQLite: PASS")

          print("[check] Windows capture adapter...")
          from os_adapters import Adapter
          title = Adapter().get_window_title()
          print(f"[check] get_window_title: {repr(title[:40])}: PASS")

          print("[check] Agent modules (import only)...")
          import auth, database, config, sync
          print("[check] Agent modules: PASS")

          print("[check] Realtime client (import only)...")
          import realtime_client
          print("[check] Realtime client: PASS")

          print("\n[check] All pre-build checks PASSED.")
          '@
          Set-Content -Path "$env:TEMP\bh_prebuild.py" -Value $script
          .\.venv\Scripts\python.exe "$env:TEMP\bh_prebuild.py" (Get-Location).Path

      # ── Version consistency ───────────────────────────────────────────────────
      - name: Version consistency pre-check
        shell: pwsh
        run: |
          $ver = "$env:BUILD_VERSION"
          Write-Host "Build version: $ver"
          # Version is injected into the installer at ISCC compile time via /DMyAppVersion.
          # We verify the installer filename post-build; this step validates format only.
          if ($ver -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version format invalid: $ver"
          }
          Write-Host "Version format consistent: $ver"

      # ── Embed version constant ────────────────────────────────────────────────
      - name: Generate _version.py
        working-directory: agent
        shell: pwsh
        run: |
          $ver = "$env:BUILD_VERSION"
          "__version__ = '$ver'" | Set-Content _version.py -Encoding utf8
          Write-Host "Generated _version.py: __version__ = '$ver'"

      # ── PyInstaller ───────────────────────────────────────────────────────────
      - name: Build with PyInstaller
        working-directory: agent
        shell: pwsh
        run: |
          Write-Host "Building BuildHarvey v$env:BUILD_VERSION with PyInstaller..."
          .\.venv\Scripts\pyinstaller --clean build_windows.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }

      - name: Verify executable produced + PE header
        working-directory: agent
        shell: pwsh
        run: |
          $exe = "dist\BuildHarvey\BuildHarvey.exe"
          if (!(Test-Path $exe)) { throw "BuildHarvey.exe not produced at $exe" }

          # PE header validation: verify MZ magic bytes
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe).Path)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "PE header validation FAILED: not a valid Windows executable (expected MZ)"
          }
          Write-Host "PE header: valid (MZ signature)"

          $sizeMB = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "BuildHarvey.exe: $sizeMB MB"
          echo "EXE_SIZE_MB=$sizeMB" >> $env:GITHUB_ENV

      # ── Unpacked executable self-test ─────────────────────────────────────────
      - name: Run unpacked executable self-test
        working-directory: agent
        shell: pwsh
        run: |
          Write-Host "Running: BuildHarvey.exe --self-test --noninteractive"
          $proc = Start-Process `
            -FilePath (Resolve-Path "dist\BuildHarvey\BuildHarvey.exe") `
            -ArgumentList "--self-test", "--noninteractive" `
            -Wait -PassThru -WindowStyle Hidden
          $log = "$env:TEMP\buildharvey-self-test.log"
          if (Test-Path $log) {
            Write-Host "--- self-test log ---"
            Get-Content $log
            Write-Host "--- end log ---"
          }
          if ($proc.ExitCode -ne 0) {
            throw "Unpacked self-test FAILED (exit code $($proc.ExitCode))"
          }
          Write-Host "Unpacked self-test PASSED"

      # ── Inno Setup installer ──────────────────────────────────────────────────
      - name: Build installer with Inno Setup
        working-directory: agent
        shell: pwsh
        run: |
          $iscc = "$env:INNOSETUP_DIR\ISCC.exe"
          Write-Host "Building installer v$env:BUILD_VERSION..."
          & $iscc "/DMyAppVersion=$env:BUILD_VERSION" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compiler failed" }

      - name: Verify installer produced
        working-directory: agent
        shell: pwsh
        run: |
          $ver = "$env:BUILD_VERSION"
          $installer = "Output\BuildHarveySetup-$ver.exe"
          if (!(Test-Path $installer)) {
            throw "Installer not found: $installer — version mismatch or compile failure"
          }
          $sizeMB = [math]::Round((Get-Item $installer).Length / 1MB, 1)
          Write-Host "Installer: $installer ($sizeMB MB)"
          echo "INSTALLER_SIZE_MB=$sizeMB" >> $env:GITHUB_ENV

      # ── Silent installer install → self-test → uninstall ─────────────────────
      - name: Install, self-test, and uninstall the built installer
        working-directory: agent
        shell: pwsh
        run: |
          $ver = "$env:BUILD_VERSION"
          $installer = Resolve-Path "Output\BuildHarveySetup-$ver.exe"

          Write-Host "Running silent install: $installer"
          $proc = Start-Process -FilePath $installer `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" `
            -Wait -PassThru -WindowStyle Hidden
          if ($proc.ExitCode -ne 0) { throw "Silent install failed (exit code $($proc.ExitCode))" }

          # Locate installed executable — installer uses {autopf} with PrivilegesRequired=lowest
          $installed = $null
          foreach ($candidate in @(
            "$env:ProgramFiles\BuildHarvey\BuildHarvey.exe",
            "$env:LOCALAPPDATA\Programs\BuildHarvey\BuildHarvey.exe"
          )) {
            if (Test-Path $candidate) { $installed = $candidate; break }
          }
          if (!$installed) { throw "Installed BuildHarvey.exe not found in expected locations" }
          Write-Host "Installed at: $installed"

          # Run installed self-test
          # Clear previous log so we know this run produced it
          $log = "$env:TEMP\buildharvey-self-test.log"
          if (Test-Path $log) { Remove-Item $log -Force }
          $proc2 = Start-Process -FilePath $installed `
            -ArgumentList "--self-test", "--noninteractive" `
            -Wait -PassThru -WindowStyle Hidden
          if (Test-Path $log) {
            Write-Host "--- installed self-test log ---"
            Get-Content $log
            Write-Host "--- end log ---"
          }
          if ($proc2.ExitCode -ne 0) {
            throw "Installed self-test FAILED (exit code $($proc2.ExitCode))"
          }
          Write-Host "Installed self-test: PASSED"

          # Silent uninstall
          $installDir = Split-Path $installed -Parent
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (!(Test-Path $uninstaller)) { throw "Uninstaller not found at $uninstaller" }
          $proc3 = Start-Process -FilePath $uninstaller `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" `
            -Wait -PassThru -WindowStyle Hidden
          if ($proc3.ExitCode -ne 0) { throw "Uninstall failed (exit code $($proc3.ExitCode))" }
          if (Test-Path $installed) { throw "BuildHarvey.exe still present after uninstall" }
          Write-Host "Uninstall: COMPLETED — executable removed"

      # ── SHA-256 checksum ──────────────────────────────────────────────────────
      - name: Compute SHA-256 checksum
        working-directory: agent
        id: checksum
        shell: pwsh
        run: |
          $ver = "$env:BUILD_VERSION"
          $installer = "Output\BuildHarveySetup-$ver.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          "$hash  BuildHarveySetup-$ver.exe" |
            Out-File -FilePath "Output\BuildHarveySetup-$ver.sha256" -Encoding ascii
          Write-Host "SHA-256: $hash"
          echo "sha256=$hash" >> $env:GITHUB_OUTPUT

      # ── Version consistency post-check ────────────────────────────────────────
      - name: Version consistency post-check
        working-directory: agent
        shell: pwsh
        run: |
          $ver = "$env:BUILD_VERSION"
          $checks = @(
            "Output\BuildHarveySetup-$ver.exe",
            "Output\BuildHarveySetup-$ver.sha256"
          )
          $failed = @()
          foreach ($f in $checks) {
            if (Test-Path $f) {
              Write-Host "  ok  $f"
            } else {
              $failed += $f
              Write-Host "  MISS $f"
            }
          }
          if ($failed.Count -gt 0) {
            throw "Version consistency check failed: $($failed -join ', ') not found for version $ver"
          }
          Write-Host "Version consistency: all artifacts contain version $ver"

      # ── Workflow summary ──────────────────────────────────────────────────────
      - name: Write workflow summary
        working-directory: agent
        shell: pwsh
        run: |
          $ver    = "$env:BUILD_VERSION"
          $sha256 = "${{ steps.checksum.outputs.sha256 }}"
          $pyVer  = .\.venv\Scripts\python.exe --version 2>&1
          $piVer  = .\.venv\Scripts\pyinstaller.exe --version 2>&1
          @"
          ## BuildHarvey Windows Installer — v$ver

          | | |
          |---|---|
          | **Version** | $ver |
          | **Commit** | ${{ github.sha }} |
          | **Python** | $pyVer |
          | **PyInstaller** | $piVer |
          | **Tesseract** | $env:TESSERACT_ACTUAL_VERSION |
          | **Claude** | Via server (ANTHROPIC_CAPTURE_MODEL env) |
          | **Installer** | BuildHarveySetup-$ver.exe ($env:INSTALLER_SIZE_MB MB) |
          | **Executable** | BuildHarvey.exe ($env:EXE_SIZE_MB MB) |
          | **SHA-256** | ``$sha256`` |
          | **Secret audit** | Passed |
          | **PE header** | MZ valid |
          | **Unpacked self-test** | Passed |
          | **Installed self-test** | Passed |
          | **Uninstall** | Verified |
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      # ── Upload artifacts ──────────────────────────────────────────────────────
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BuildHarvey-${{ github.event.inputs.version }}-windows
          path: |
            agent/Output/BuildHarveySetup-${{ github.event.inputs.version }}.exe
            agent/Output/BuildHarveySetup-${{ github.event.inputs.version }}.sha256
            agent/pip-freeze-${{ github.event.inputs.version }}.txt
          if-no-files-found: error
          retention-days: 90

      # ── Website publication ───────────────────────────────────────────────────
      - name: Publish to buildharvey.com
        if: ${{ github.event.inputs.publish_to_buildharvey == 'true' }}
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if (!$env:SUPABASE_URL -or !$env:SUPABASE_SERVICE_ROLE_KEY) {
            throw "SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY secrets are required for publication"
          }

          $ver       = "$env:BUILD_VERSION"
          $sha256    = "${{ steps.checksum.outputs.sha256 }}"
          $apiUrl    = $env:SUPABASE_URL
          $svcKey    = $env:SUPABASE_SERVICE_ROLE_KEY
          $storagePath = "windows/BuildHarveySetup-$ver.exe"
          $exePath   = "agent\Output\BuildHarveySetup-$ver.exe"
          $hashPath  = "agent\Output\BuildHarveySetup-$ver.sha256"

          Write-Host "Publishing BuildHarvey v$ver to buildharvey.com..."

          # 1. Upload installer EXE (upsert)
          Write-Host "Uploading installer to Supabase Storage..."
          $uploadUri = "$apiUrl/storage/v1/object/releases/$storagePath"
          Invoke-WebRequest -Uri $uploadUri -Method PUT `
            -InFile $exePath `
            -Headers @{
              "Authorization" = "Bearer $svcKey"
              "Content-Type"  = "application/octet-stream"
              "x-upsert"      = "true"
            } | Out-Null
          Write-Host "EXE uploaded."

          # 2. Upload SHA-256 checksum file
          $hashUploadUri = "$apiUrl/storage/v1/object/releases/windows/BuildHarveySetup-$ver.sha256"
          Invoke-WebRequest -Uri $hashUploadUri -Method PUT `
            -InFile $hashPath `
            -Headers @{
              "Authorization" = "Bearer $svcKey"
              "Content-Type"  = "text/plain"
              "x-upsert"      = "true"
            } | Out-Null
          Write-Host "Checksum uploaded."

          # 3. Verify both objects exist in storage
          $verifyExe = "$apiUrl/storage/v1/object/info/releases/$storagePath"
          $statusExe = (Invoke-WebRequest -Uri $verifyExe -Method GET `
            -Headers @{ "Authorization" = "Bearer $svcKey" } `
            -SkipHttpErrorCheck).StatusCode
          if ($statusExe -ne 200) {
            throw "Storage verification failed for installer (HTTP $statusExe)"
          }
          Write-Host "Storage verification: EXE present"

          $verifyHash = "$apiUrl/storage/v1/object/info/releases/windows/BuildHarveySetup-$ver.sha256"
          $statusHash = (Invoke-WebRequest -Uri $verifyHash -Method GET `
            -Headers @{ "Authorization" = "Bearer $svcKey" } `
            -SkipHttpErrorCheck).StatusCode
          if ($statusHash -ne 200) {
            throw "Storage verification failed for checksum (HTTP $statusHash)"
          }
          Write-Host "Storage verification: checksum present"

          # 4. Insert new release record (inactive)
          $releaseBody = @{
            platform     = "windows"
            version      = $ver
            storage_path = $storagePath
            sha256       = $sha256
            active       = $false
          } | ConvertTo-Json

          $insertHeaders = @{
            "apikey"        = $svcKey
            "Authorization" = "Bearer $svcKey"
            "Content-Type"  = "application/json"
            "Prefer"        = "return=representation"
          }
          $insertResp = Invoke-RestMethod `
            -Uri "$apiUrl/rest/v1/app_releases" `
            -Method POST `
            -Headers $insertHeaders `
            -Body $releaseBody
          $newReleaseId = $insertResp[0].id
          if (!$newReleaseId) { throw "Failed to obtain new release ID from insert response" }
          Write-Host "New release record created: $newReleaseId (inactive)"

          # 5. Find existing active Windows release (to deactivate after swap)
          $queryHeaders = @{
            "apikey"        = $svcKey
            "Authorization" = "Bearer $svcKey"
          }
          $oldReleases = Invoke-RestMethod `
            -Uri "$apiUrl/rest/v1/app_releases?platform=eq.windows&active=eq.true&select=id" `
            -Method GET `
            -Headers $queryHeaders
          $oldReleaseId = $oldReleases[0]?.id
          Write-Host "Previous active Windows release: $(if ($oldReleaseId) { $oldReleaseId } else { 'none' })"

          # 6. Deactivate old release (if any) so unique constraint allows activation
          if ($oldReleaseId) {
            Invoke-RestMethod `
              -Uri "$apiUrl/rest/v1/app_releases?id=eq.$oldReleaseId" `
              -Method PATCH `
              -Headers ($queryHeaders + @{ "Content-Type" = "application/json" }) `
              -Body '{"active":false}' | Out-Null
            Write-Host "Previous release deactivated: $oldReleaseId"
          }

          # 7. Activate new release — if this fails, attempt to restore old
          try {
            Invoke-RestMethod `
              -Uri "$apiUrl/rest/v1/app_releases?id=eq.$newReleaseId" `
              -Method PATCH `
              -Headers ($queryHeaders + @{ "Content-Type" = "application/json" }) `
              -Body '{"active":true}' | Out-Null
            Write-Host "New release activated: $newReleaseId"
          } catch {
            Write-Host "ERROR: activation of new release failed: $_"
            if ($oldReleaseId) {
              Write-Host "Restoring previous active release: $oldReleaseId"
              Invoke-RestMethod `
                -Uri "$apiUrl/rest/v1/app_releases?id=eq.$oldReleaseId" `
                -Method PATCH `
                -Headers ($queryHeaders + @{ "Content-Type" = "application/json" }) `
                -Body '{"active":true}' | Out-Null
              Write-Host "Previous release restored to active."
            }
            throw "Website publication failed during activation — previous release left active"
          }

          Write-Host ""
          Write-Host "Publication complete:"
          Write-Host "  Version : $ver"
          Write-Host "  SHA-256 : $sha256"
          Write-Host "  Release : $newReleaseId"
          Write-Host "  URL     : https://buildharvey.com (download page)"

      # ── GitHub Release (when publish_release=true) ────────────────────────────
      - name: Create GitHub Release
        if: ${{ github.event.inputs.publish_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: BuildHarvey v${{ github.event.inputs.version }}
          draft: false
          prerelease: false
          body: |
            ## BuildHarvey Desktop Agent for Windows

            Install for the current user. No administrator access required.

            ### Installation
            1. Download **BuildHarveySetup-${{ github.event.inputs.version }}.exe**
            2. Run it and follow the prompts
            3. Open BuildHarvey → click **Connect Account**
            4. Click **Start Work Session** to begin capturing

            ### Verify download integrity
            **SHA-256:** `${{ steps.checksum.outputs.sha256 }}`
            ```
            certutil -hashfile BuildHarveySetup-${{ github.event.inputs.version }}.exe SHA256
            ```
          files: |
            agent/Output/BuildHarveySetup-${{ github.event.inputs.version }}.exe
            agent/Output/BuildHarveySetup-${{ github.event.inputs.version }}.sha256
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Diagnostic artifact on failure ────────────────────────────────────────
      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/buildharvey-self-test.log
            agent/pip-freeze-${{ github.event.inputs.version }}.txt
          if-no-files-found: ignore
          retention-days: 7
