name: Build Windows Installer

# Trigger manually from GitHub Actions UI.
# Enter a version number (e.g. 1.2.0) and optionally publish a GitHub Release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      publish_release:
        description: 'Create GitHub Release and attach installer'
        type: boolean
        required: false
        default: false

# GITHUB_TOKEN needs write access to create releases.
permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'
  # Pinned to a specific UB-Mannheim build — update this value to upgrade.
  TESSERACT_VERSION: '5.3.3.20231005'
  TESSERACT_DIR: 'C:\Program Files\Tesseract-OCR'
  INNOSETUP_DIR: 'C:\Program Files (x86)\Inno Setup 6'

jobs:
  build:
    name: Build v${{ github.event.inputs.version }}
    runs-on: windows-latest

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python environment ────────────────────────────────────────────────────
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: agent/requirements_windows.txt

      - name: Create virtual environment
        working-directory: agent
        shell: pwsh
        run: python -m venv .venv

      - name: Install Python dependencies
        working-directory: agent
        shell: pwsh
        run: |
          .\.venv\Scripts\pip install --upgrade pip --quiet
          .\.venv\Scripts\pip install -r requirements_windows.txt

      - name: Verify Python dependencies
        working-directory: agent
        shell: pwsh
        run: |
          $check = @'
          import sys
          print(f"Python {sys.version}")
          required = [
              "mss", "PIL", "numpy", "keyring", "psutil",
              "pytesseract", "anthropic", "win32api", "win32gui",
              "win32process", "pywinauto", "websockets", "realtime",
          ]
          failed = []
          for mod in required:
              try:
                  __import__(mod)
                  print(f"  ok   {mod}")
              except ImportError as e:
                  failed.append(f"{mod}: {e}")
                  print(f"  FAIL {mod}: {e}")
          if failed:
              sys.exit(1)
          print("All required packages present.")
          '@
          Set-Content -Path "$env:TEMP\bh_dep_check.py" -Value $check
          .\.venv\Scripts\python.exe "$env:TEMP\bh_dep_check.py"

      # ── Tesseract OCR (pinned, self-hosted from UB-Mannheim) ─────────────────
      - name: Download and install Tesseract ${{ env.TESSERACT_VERSION }}
        shell: pwsh
        run: |
          $ver = "$env:TESSERACT_VERSION"
          $url = "https://github.com/UB-Mannheim/tesseract/releases/download/v$ver/tesseract-ocr-w64-setup-$ver.exe"
          Write-Host "Downloading Tesseract $ver from UB-Mannheim..."
          Invoke-WebRequest -Uri $url -OutFile tesseract-setup.exe -UseBasicParsing

          Write-Host "Running silent installer..."
          $proc = Start-Process -FilePath ".\tesseract-setup.exe" `
            -ArgumentList "/S" -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) {
            throw "Tesseract installer exited with code $($proc.ExitCode)"
          }
          Remove-Item tesseract-setup.exe -Force

      - name: Verify Tesseract installation
        shell: pwsh
        run: |
          $exe = "$env:TESSERACT_DIR\tesseract.exe"
          if (!(Test-Path $exe)) {
            throw "tesseract.exe not found at $exe after installation"
          }
          $ver = & $exe --version 2>&1 | Select-Object -First 1
          Write-Host "Tesseract: $ver"
          $data = "$env:TESSERACT_DIR\tessdata\eng.traineddata"
          if (!(Test-Path $data)) {
            throw "eng.traineddata missing — language data not installed"
          }
          $dlls = @(Get-ChildItem "$env:TESSERACT_DIR\*.dll")
          Write-Host "DLLs present: $($dlls.Count)"
          if ($dlls.Count -eq 0) { throw "No DLLs found in Tesseract directory" }
          echo "TESSERACT_ACTUAL_VERSION=$ver" >> $env:GITHUB_ENV

      - name: Stage Tesseract into vendor/tesseract/
        working-directory: agent
        shell: pwsh
        run: |
          $src = $env:TESSERACT_DIR
          $dst = "vendor\tesseract"
          New-Item -ItemType Directory -Force -Path "$dst\tessdata" | Out-Null

          Copy-Item "$src\tesseract.exe"         $dst -Force
          Copy-Item "$src\*.dll"                 $dst -Force -ErrorAction SilentlyContinue
          Copy-Item "$src\tessdata\eng.traineddata" "$dst\tessdata\" -Force

          # Confirm all critical files are present
          if (!(Test-Path "$dst\tesseract.exe")) {
            throw "Stage failed: tesseract.exe missing"
          }
          if (!(Test-Path "$dst\tessdata\eng.traineddata")) {
            throw "Stage failed: eng.traineddata missing"
          }
          $dlls = @(Get-ChildItem "$dst\*.dll")
          if ($dlls.Count -eq 0) { throw "Stage failed: no DLLs copied" }

          Write-Host "Staged: tesseract.exe + $($dlls.Count) DLLs + tessdata/eng.traineddata"

      # ── Inno Setup ───────────────────────────────────────────────────────────
      - name: Install Inno Setup
        shell: pwsh
        run: |
          Write-Host "Installing Inno Setup via Chocolatey..."
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey failed to install Inno Setup" }

      - name: Verify Inno Setup
        shell: pwsh
        run: |
          $iscc = "$env:INNOSETUP_DIR\ISCC.exe"
          if (!(Test-Path $iscc)) {
            throw "ISCC.exe not found at $iscc — Inno Setup may have installed to a different path"
          }
          Write-Host "Inno Setup verified: $iscc"

      # ── Pre-build self-checks ─────────────────────────────────────────────────
      - name: Run pre-build checks
        working-directory: agent
        shell: pwsh
        run: |
          $script = @'
          import sys, os, tempfile, sqlite3

          os.chdir(sys.argv[1])   # run from agent/ so relative imports work
          sys.path.insert(0, ".")

          print("[check] Core Python imports...")
          import mss, PIL, numpy, keyring, psutil, pytesseract, anthropic
          import win32api, win32gui, win32process
          print("[check] Core imports: PASS")

          print("[check] OCR with staged vendor Tesseract...")
          from PIL import Image, ImageDraw
          pytesseract.pytesseract.tesseract_cmd = r"vendor\tesseract\tesseract.exe"
          os.environ["TESSDATA_PREFIX"] = r"vendor\tesseract\tessdata"
          img = Image.new("RGB", (500, 80), color="white")
          draw = ImageDraw.Draw(img)
          draw.text((10, 25), "BuildHarvey OCR Test", fill="black")
          tmp = tempfile.mktemp(suffix=".png")
          img.save(tmp)
          result = pytesseract.image_to_string(Image.open(tmp), lang="eng")
          os.unlink(tmp)
          if "buildharvey" not in result.lower() and "ocr" not in result.lower():
              raise RuntimeError(f"OCR smoke test FAILED — got: {repr(result.strip()[:100])}")
          print("[check] OCR smoke test: PASS")

          print("[check] SQLite...")
          db = tempfile.mktemp(suffix=".db")
          conn = sqlite3.connect(db)
          conn.execute("CREATE TABLE t (id TEXT PRIMARY KEY)")
          conn.close()
          os.unlink(db)
          print("[check] SQLite: PASS")

          print("[check] Windows capture adapter (non-destructive)...")
          from os_adapters import Adapter
          adapter = Adapter()
          title = adapter.get_window_title()
          print(f"[check] WindowsAdapter.get_window_title: {repr(title[:40])!r}: PASS")

          print("[check] Agent modules (import only)...")
          import auth, database, config, sync
          print("[check] Agent modules: PASS")

          print("[check] Realtime client (import only)...")
          import realtime_client
          print("[check] Realtime client: PASS")

          print("\n[check] All pre-build checks PASSED.")
          '@
          Set-Content -Path "$env:TEMP\bh_prebuild.py" -Value $script
          .\.venv\Scripts\python.exe "$env:TEMP\bh_prebuild.py" (Get-Location).Path

      # ── PyInstaller ──────────────────────────────────────────────────────────
      - name: Build with PyInstaller
        working-directory: agent
        shell: pwsh
        run: |
          Write-Host "Building BuildHarvey with PyInstaller..."
          .\.venv\Scripts\pyinstaller --clean build_windows.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }

      - name: Verify executable produced
        working-directory: agent
        shell: pwsh
        run: |
          $exe = "dist\BuildHarvey\BuildHarvey.exe"
          if (!(Test-Path $exe)) {
            throw "BuildHarvey.exe was not produced at $exe"
          }
          $sizeMB = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "BuildHarvey.exe: $sizeMB MB"
          echo "EXE_SIZE_MB=$sizeMB" >> $env:GITHUB_ENV

      # ── Packaged smoke test ───────────────────────────────────────────────────
      - name: Run packaged smoke test
        working-directory: agent
        shell: pwsh
        run: |
          Write-Host "Running: BuildHarvey.exe --self-test --noninteractive"
          $proc = Start-Process `
            -FilePath (Resolve-Path "dist\BuildHarvey\BuildHarvey.exe") `
            -ArgumentList "--self-test", "--noninteractive" `
            -Wait -PassThru -WindowStyle Hidden
          $log = "$env:TEMP\buildharvey-self-test.log"
          if (Test-Path $log) {
            Write-Host "--- self-test log ---"
            Get-Content $log
            Write-Host "--- end log ---"
          }
          if ($proc.ExitCode -ne 0) {
            throw "Packaged smoke test FAILED (exit code $($proc.ExitCode))"
          }
          Write-Host "Packaged smoke test PASSED (exit code 0)"

      # ── Inno Setup installer ─────────────────────────────────────────────────
      - name: Build installer
        working-directory: agent
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          $iscc = "$env:INNOSETUP_DIR\ISCC.exe"
          Write-Host "Building installer v$version with Inno Setup..."
          & $iscc "/DMyAppVersion=$version" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compiler failed" }

      - name: Verify installer produced
        working-directory: agent
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          $installer = "Output\BuildHarveySetup-$version.exe"
          if (!(Test-Path $installer)) {
            throw "Installer not found: $installer"
          }
          $sizeMB = [math]::Round((Get-Item $installer).Length / 1MB, 1)
          Write-Host "Installer: $installer ($sizeMB MB)"
          echo "INSTALLER_SIZE_MB=$sizeMB" >> $env:GITHUB_ENV

      # ── SHA-256 checksum ─────────────────────────────────────────────────────
      - name: Compute SHA-256 checksum
        working-directory: agent
        id: checksum
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          $installer = "Output\BuildHarveySetup-$version.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          "$hash  BuildHarveySetup-$version.exe" |
            Out-File -FilePath "Output\BuildHarveySetup-$version.sha256" -Encoding ascii
          Write-Host "SHA-256: $hash"
          echo "sha256=$hash" >> $env:GITHUB_OUTPUT

      # ── Workflow summary ──────────────────────────────────────────────────────
      - name: Write workflow summary
        shell: pwsh
        run: |
          $version  = "${{ github.event.inputs.version }}"
          $sha256   = "${{ steps.checksum.outputs.sha256 }}"
          $pyVer    = .\.venv\Scripts\python.exe --version 2>&1
          $piVer    = .\.venv\Scripts\pyinstaller.exe --version 2>&1
          @"
          ## BuildHarvey Windows Installer — v$version

          | | |
          |---|---|
          | **Version** | $version |
          | **Commit** | ${{ github.sha }} |
          | **Python** | $pyVer |
          | **PyInstaller** | $piVer |
          | **Tesseract** | $env:TESSERACT_ACTUAL_VERSION |
          | **spaCy** | Removed — Claude Vision handles all classification |
          | **Installer** | BuildHarveySetup-$version.exe ($env:INSTALLER_SIZE_MB MB) |
          | **Executable** | BuildHarvey.exe ($env:EXE_SIZE_MB MB) |
          | **SHA-256** | ``$sha256`` |
          | **Pre-build checks** | All passed |
          | **Packaged smoke test** | Passed |
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
        working-directory: agent

      # ── Upload artifacts ──────────────────────────────────────────────────────
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BuildHarvey-${{ github.event.inputs.version }}-windows
          path: |
            agent/Output/BuildHarveySetup-${{ github.event.inputs.version }}.exe
            agent/Output/BuildHarveySetup-${{ github.event.inputs.version }}.sha256
          if-no-files-found: error
          retention-days: 90

      # ── GitHub Release (when publish_release=true) ────────────────────────────
      - name: Create GitHub Release
        if: ${{ github.event.inputs.publish_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: BuildHarvey v${{ github.event.inputs.version }}
          draft: false
          prerelease: false
          body: |
            ## BuildHarvey Desktop Agent for Windows

            Install for the current user. No administrator access required.

            ### Installation
            1. Download **BuildHarveySetup-${{ github.event.inputs.version }}.exe**
            2. Run it and follow the prompts
            3. Open BuildHarvey → click **Connect Account**
            4. Click **Start Work Session** to begin capturing

            ### Verify download integrity
            **SHA-256:** `${{ steps.checksum.outputs.sha256 }}`
            ```
            certutil -hashfile BuildHarveySetup-${{ github.event.inputs.version }}.exe SHA256
            ```
          files: |
            agent/Output/BuildHarveySetup-${{ github.event.inputs.version }}.exe
            agent/Output/BuildHarveySetup-${{ github.event.inputs.version }}.sha256
          token: ${{ secrets.GITHUB_TOKEN }}
